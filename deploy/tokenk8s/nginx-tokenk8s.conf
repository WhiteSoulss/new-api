# tokenk8s.com service aliases. The original guanqiintelligence.com virtual
# hosts remain enabled temporarily as a rollback path during domain migration.

server {
    listen 80;
    listen [::]:80;
    server_name tokenk8s.com www.tokenk8s.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tokenk8s.com www.tokenk8s.com;

    ssl_certificate /etc/letsencrypt/live/tokenk8s.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tokenk8s.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /guanqi-home-v2/index.html {
        alias /var/www/guanqi-home/index.html;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }

    location ^~ /guanqi-home-v2/ {
        alias /var/www/guanqi-home/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    location / {
        client_max_body_size 256m;

        proxy_pass http://new_api_backend;
        proxy_http_version 1.1;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        # The app renders the custom homepage inside its own header. Keep that
        # header in the same dark palette even after client-side navigation.
        # Only HTML is modified; JSON and streaming API bodies are untouched.
        proxy_set_header Accept-Encoding "";
        sub_filter_types text/html;
        sub_filter_once on;
        sub_filter '</head>' '<link rel="stylesheet" href="/guanqi-home-v2/assets/parent-home.css?v=1"></head>';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

