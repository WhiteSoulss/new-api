# Public HTTP/IP diagnostic entry for the existing TokenK8s homepage.
# Do not expose New API authentication, sessions or relay traffic over HTTP.
log_format tokenk8s_ip '$remote_addr [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    'request_time=$request_time';

server {
    listen 80;
    server_name 101.47.18.106;

    access_log /var/log/nginx/tokenk8s-ip.access.log tokenk8s_ip;
    error_log /var/log/nginx/tokenk8s-ip.error.log;
    client_max_body_size 1m;

    # This unencrypted entry is only for public, read-only browsing.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    location = / {
        rewrite ^ /guanqi-home-v2/index.html last;
    }

    location = /guanqi-home-v2/index.html {
        alias /var/www/guanqi-home/index.html;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff";
    }

    location ^~ /guanqi-home-v2/ {
        alias /var/www/guanqi-home/;
        expires 7d;
        add_header X-Content-Type-Options "nosniff";
    }

    location = /api/status {
        proxy_pass http://new_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host tokenk8s.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store";
    }

    # Login, console and other application routes retain their HTTPS origin.
    location / {
        return 302 https://tokenk8s.com$request_uri;
    }
}
